{{define "content"}}
{{if not .Rows}}
<p>No saved scans yet. Run <code>mitch scan</code> to save one.</p>
{{else}}
<div class="table-wrap">
<table>
<thead><tr><th>Scan</th><th>Started</th><th>Finished</th><th>Changes</th></tr></thead>
<tbody>
{{range .Rows}}
<tr>
  <td><a href="/scans/{{.Scan.ID}}"><code>{{.Scan.ID}}</code></a></td>
  <td>{{when .Scan.StartedAt}}</td>
  <td>{{when .Scan.FinishedAt}}</td>
  <td>{{if .PreviousID}}<a href="/diff?from={{.PreviousID}}&amp;to={{.Scan.ID}}">since previous scan</a>{{else}}first scan{{end}}</td>
</tr>
{{end}}
</tbody>
</table>
</div>
{{end}}
{{end}}
