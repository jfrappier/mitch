# Continuous integration for Mitch.
#
# Runs on every pull request and every push to main:
#   lint  - golangci-lint with the settings in .golangci.yml
#   test  - all tests with the race detector, on Linux and macOS
#   integration - tests against real Vault dev servers (oldest and newest supported)
#   build - a static binary for every platform Mitch ships for
#
# Any failing step fails the whole run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -v ./...

  integration:
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Vault Community versions.
        vault: ["1.19.5", "2.2.2"]
    runs-on: ubuntu-latest
    services:
      vault:
        # The official image starts a dev server by default.
        image: hashicorp/vault:${{ matrix.vault }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      MITCH_TEST_VAULT_ADDR: http://127.0.0.1:8200
      MITCH_TEST_VAULT_ROOT_TOKEN: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Wait for Vault ${{ matrix.vault }}
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MITCH_TEST_VAULT_ADDR/v1/sys/health" || true)"
            echo "attempt $attempt: sys/health returned HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Vault did not become healthy after 30 attempts"
          exit 1
      - name: Integration tests against Vault ${{ matrix.vault }}
        run: go test -tags integration -race -count=1 -v ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO_ENABLED=0 guarantees a static binary with no C dependencies.
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o "dist/mitch-${GOOS}-${GOARCH}" ./cmd/mitch
          ls -l dist/
