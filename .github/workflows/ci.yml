# Continuous integration for Mitch.
#
# Runs on every pull request and every push to main:
#   lint  - golangci-lint with the settings in .golangci.yml
#   dependency-pins - modernc.org/libc matches what modernc.org/sqlite requires
#   test  - all tests with the race detector, on Linux and macOS
#   integration - tests against real Vault dev servers (oldest and newest supported),
#                 including "terraform plan" on what "mitch terraform" writes
#   build - a static binary for every platform Mitch ships for
#
# Any failing step fails the whole run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  dependency-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # modernc.org/sqlite only works with the exact modernc.org/libc version
      # named in its own go.mod (https://pkg.go.dev/modernc.org/sqlite).
      # This fails if go.mod uses any other libc version.
      - name: Check modernc.org/libc matches modernc.org/sqlite
        run: |
          set -euo pipefail
          sqlite_version="$(go list -m -f '{{.Version}}' modernc.org/sqlite)"
          libc_in_use="$(go list -m -f '{{.Version}}' modernc.org/libc)"
          libc_required="$(go mod graph | awk -v parent="modernc.org/sqlite@${sqlite_version}" '$1 == parent && $2 ~ /^modernc\.org\/libc@/ { sub(/^modernc\.org\/libc@/, "", $2); print $2 }')"

          echo "modernc.org/sqlite ${sqlite_version} requires modernc.org/libc ${libc_required:-<not found>}"
          echo "go.mod uses modernc.org/libc ${libc_in_use}"

          if [ -z "$libc_required" ]; then
            echo "Could not find which modernc.org/libc version modernc.org/sqlite ${sqlite_version} requires."
            exit 1
          fi
          if [ "$libc_in_use" != "$libc_required" ]; then
            echo "modernc.org/libc ${libc_in_use} does not match the ${libc_required} that modernc.org/sqlite ${sqlite_version} requires."
            echo "Fix: go get modernc.org/libc@${libc_required} && go mod tidy"
            echo "To upgrade libc, upgrade modernc.org/sqlite instead: go get modernc.org/sqlite@<version> && go mod tidy"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -v ./...

  integration:
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Vault Community versions.
        vault: ["1.19.5", "2.2.2"]
    runs-on: ubuntu-latest
    services:
      vault:
        # The official image starts a dev server by default.
        image: hashicorp/vault:${{ matrix.vault }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      MITCH_TEST_VAULT_ADDR: http://127.0.0.1:8200
      MITCH_TEST_VAULT_ROOT_TOKEN: root
      TERRAFORM_VERSION: "1.17.2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Wait for Vault ${{ matrix.vault }}
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MITCH_TEST_VAULT_ADDR/v1/sys/health" || true)"
            echo "attempt $attempt: sys/health returned HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Vault did not become healthy after 30 attempts"
          exit 1
      # The Terraform test runs "terraform plan" on what "mitch terraform"
      # writes. The binary is checked against HashiCorp's SHA256SUMS file.
      # Docs: https://developer.hashicorp.com/terraform/install
      - name: Install Terraform ${{ env.TERRAFORM_VERSION }}
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --show-error --no-progress-meter --location --output "$zip" --write-out "${zip}: HTTP %{http_code}\n" "$base/$zip"
          curl --fail --show-error --no-progress-meter --location --output SHA256SUMS --write-out "SHA256SUMS: HTTP %{http_code}\n" "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " ${zip}\$" SHA256SUMS | sha256sum --check
          unzip -q "$zip" -d terraform-bin
          ./terraform-bin/terraform version
          echo "MITCH_TEST_TERRAFORM=$RUNNER_TEMP/terraform-bin/terraform" >> "$GITHUB_ENV"
      - name: Integration tests against Vault ${{ matrix.vault }}
        run: go test -tags "integration terraform" -race -count=1 -v ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO_ENABLED=0 guarantees a static binary with no C dependencies.
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o "dist/mitch-${GOOS}-${GOARCH}" ./cmd/mitch
          ls -l dist/
